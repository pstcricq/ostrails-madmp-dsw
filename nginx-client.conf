# The client image's own /etc/nginx/conf.d/default.conf, from
# datastewardshipwizard/wizard-client:4.31, mounted over it with two lines
# changed. Everything else is the image's, unchanged.
#
#   absolute_redirect off;    added
#   return 301 /wizard/;      was: return 301 $scheme://$http_host/wizard/;
#
# Why. The image builds an absolute redirect out of $scheme, and $scheme is the
# protocol nginx itself listens on, which is plain http. Put a TLS terminator in
# front, and a Codespaces forwarded port is exactly that, and the browser sitting
# on https is sent to http on a host that only serves https. Measured on
# 2026-08-10 against the 4.31 image:
#
#   Location: http://<name>-8080.app.github.dev/wizard/
#
# A relative redirect leaves scheme, host and port to the browser, the only party
# that knows what they really are. `absolute_redirect off` is required alongside
# it: without that directive nginx turns the relative path back into an absolute
# URL and appends its own listen port, which is where the stray :8080 came from.
#
# This is a bug for anyone deploying DSW behind HTTPS, which is what upstream's
# own compose comments recommend, so it is worth reporting rather than carrying
# forever.
#
# (!!) This file shadows the image's. Compare the two on every DSW upgrade, or a
# route added upstream will silently not exist here. The image's copy is 21 lines
# and reads in one go:
#
#   docker run --rm --entrypoint cat \
#     datastewardshipwizard/wizard-client:4.31 /etc/nginx/conf.d/default.conf
#
server {
    listen       8080;
    server_name  localhost;

    absolute_redirect off;

    location = / {
        return 301 /wizard/;
    }

    location /wizard/ {
        root   /usr/share/nginx/html;
        add_header  Last-Modified "";
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    error_page 404 =200 /wizard/index.html;
}
