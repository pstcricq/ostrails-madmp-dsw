# One job over what this repository can check without deploying: whether the
# deployment files parse and resolve. Whether a deployment is *correct* only
# shows on a real host, and nothing here pretends otherwise.
#
# There is no Python left to check. The webhook is installed from madmp-core,
# which lints and tests it where it lives.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# These are pure checks, nothing here writes anywhere, so the token gets the
# least it can hold.
permissions:
  contents: read

# Cancel a superseded run rather than queue it. The only cost of stopping one is
# the seconds it had already spent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # A stuck job holds a runner for six hours by default. Nothing here takes
    # more than one minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Both tools ship with the runner, so these cost nothing to run and catch
      # what would otherwise surface on a server: a compose file that no longer
      # parses, a variable that resolves to nothing, a quoting mistake in the
      # one script a deployment runs.
      #
      # A value is given for the build secret because `config` resolves it and
      # an empty one is an error. Nothing is built here.
      - name: The compose file resolves
        env:
          MADMP_CORE_TOKEN: not-a-token
        run: docker compose --env-file .env.example config --quiet
      - name: The deployment script
        run: shellcheck scripts/setup.sh
      - name: The workflows
        uses: docker://rhysd/actionlint:latest
