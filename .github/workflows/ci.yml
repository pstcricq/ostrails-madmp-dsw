# Three checks on the deployment files, each with the tool that reads them.
# Nothing is built, pulled or deployed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, nothing here writes.
permissions:
  contents: read

# A new run cancels the one it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Parses docker-compose.yml and resolves it against .env.example. A
      # variable that file does not carry is a warning here, not a failure.
      - name: The compose file resolves
        run: docker compose --env-file .env.example config --quiet
      - name: The deployment script
        run: shellcheck scripts/setup.sh
      - name: The workflows
        uses: docker://rhysd/actionlint:latest
