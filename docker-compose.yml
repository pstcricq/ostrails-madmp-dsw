# Pinned so containers, volumes and the compose network keep their names whatever
# the folder is called.
name: madmp-dsw

# DSW's own configuration, passed as environment rather than through a mounted
# application.yml. Every name below is that file's YAML path in upper case, and
# DSW resolves a setting from the environment first, then its config file, then a
# default compiled into the image.
#
# (!!) The image ships its own application.yml underneath, and its defaults are
# not neutral: it names the database `wizard`, where ours is whatever POSTGRES_DB
# says. Set every value that matters rather than relying on a fallback.
#
# (!!) No `:-default` anywhere in this file. .env.example is where a default
# value is written down, and repeating it here would give it a second home to
# drift from. A variable missing from .env resolves to an empty string and
# compose warns about it by name, which is what we want said out loud. It is a
# warning and not an error, compose exits 0 either way, so what refuses to
# start on it is `scripts/setup.sh` and not compose.
x-dsw-config: &dsw-config
  GENERAL_CLIENT_URL: ${CLIENT_URL}
  GENERAL_SECRET: ${GENERAL_SECRET}
  GENERAL_RSA_PRIVATE_KEY: ${GENERAL_RSA_PRIVATE_KEY}
  DATABASE_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_URL: ${S3_URL}
  S3_USERNAME: ${MINIO_ROOT_USER}
  S3_PASSWORD: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET}

services:
  # server and docworker share the block above, which is what mounting one
  # application.yml into both used to do.
  server:
    image: datastewardshipwizard/wizard-server:${DSW_VERSION}
    # This image is published for amd64 only, so an ARM host runs it under
    # emulation. The client, docworker and mailer images are multi-arch and
    # carry no platform on purpose, one would put them under emulation too.
    platform: linux/amd64
    restart: always
    ports:
      # Bound to the loopback. Reaching it from another machine goes through an
      # HTTPS proxy, not by widening this.
      - 127.0.0.1:3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *dsw-config
    extra_hosts:
      - host.docker.internal:host-gateway
    # Same test as the image's own, at a usable cadence. The image ships it with
    # a 300s interval and no start period, and docker runs the first check only
    # after one full interval, so the container could not report healthy in under
    # five minutes however fast it answered. docworker waits on this, and so does
    # anything watching for the server to fall over.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 10s
      # The first run applies 67 migrations, which is what this leaves room for.
      # Failures during that window do not count against retries.
      start_period: 300s
      retries: 3

  client:
    image: datastewardshipwizard/wizard-client:${DSW_VERSION}
    restart: always
    ports:
      # Loopback here too.
      - 127.0.0.1:8080:8080
    environment:
      # The client image's own variable, not a DSW config path. The browser
      # calls the API itself and the client only tells it where, so this has to
      # be an address the *user's* machine resolves, never a compose service
      # name.
      API_URL: ${API_URL}

  docworker:
    image: datastewardshipwizard/document-worker:${DSW_VERSION}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The server image carries its own healthcheck, so this waits for an API
      # that answers rather than for a container that exists.
      server:
        condition: service_healthy
    environment:
      <<: *dsw-config
      # The image bakes APPLICATION_CONFIG_PATH=/app/config/application.yml, and
      # its CLI checks that the path exists before reading any configuration. So
      # the file has to be there even when every setting comes from the
      # environment. /dev/null passes the check and parses as an empty document,
      # which leaves the environment as the only source. The server has no such
      # requirement, it starts with no config file at all.
      APPLICATION_CONFIG_PATH: /dev/null
    extra_hosts:
      - host.docker.internal:host-gateway

  # Commented out rather than deleted: with mail disabled it has nothing to
  # process and idles forever. What it leaves out is password reset and e-mail
  # invitations, both already impossible without mail.
  #
  # (!!) Uncomment it together with enabling mail. Enabling mail without it
  # fails silently: the server queues mailer commands nobody processes, and the
  # interface still reports the message as sent.
  # mailer:
  #   image: datastewardshipwizard/mailer:${DSW_VERSION}
  #   restart: always
  #   depends_on:
  #     - postgres
  #     - server
  #   environment:
  #     <<: *dsw-config
  #     APPLICATION_CONFIG_PATH: /dev/null   # same requirement as docworker

  # maDMP submission webhook (DSW Submit -> the registry on GitHub). Its code
  # and its Dockerfile are both in madmp-core, and what is pulled here is the
  # image that repository publishes on a tag. DSW reaches it by service name on
  # the compose network (http://submission:8080), so it needs no published
  # port.

  submission:
    # Pulled like every other image in this file, and nothing here is built.
    # MADMP_CORE_VERSION is what decides which engine and which rules judge a
    # submission, which is why it sits in .env beside the other image versions
    # rather than inside a Dockerfile.
    #
    # (!!) The package is private for as long as madmp-core is, so a host that
    # has never run `docker login ghcr.io` fails the pull with a 401 that reads
    # like the image does not exist.
    image: ghcr.io/pstcricq/ostrails-madmp-core/submission:${MADMP_CORE_VERSION}
    restart: always
    # Listed one by one rather than `env_file: .env`, so the webhook holds its
    # own four variables and none of the stack's other secrets.
    environment:
      SUBMISSION_TOKEN: ${SUBMISSION_TOKEN}
      REGISTRY_TOKEN: ${REGISTRY_TOKEN}
      REGISTRY_OWNER: ${REGISTRY_OWNER}
      REGISTRY_REPO: ${REGISTRY_REPO}
    # /health answers only once the four variables above are in place, so this
    # separates "misconfigured" from "up". python rather than curl, the image is
    # python:slim and installing curl for a healthcheck would be one more
    # package to keep patched.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/health")
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No host port needed. Uncomment to poke it from the terminal for debugging.
    # ports:
    #   - 127.0.0.1:8085:8080

  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: always
    # ports:
    #   - 127.0.0.1:5432:5432
    # Not published: nothing on the host calls it. Containers reach it as
    # postgres:5432, and inspecting it goes through the Docker daemon:
    #
    #   docker compose exec postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
    #
    # (!!) The database and the account are created once, at the very first
    # initdb. Changing these three values afterwards has no effect on an
    # existing database, it takes a `docker compose down -v` to start over.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # What server and docworker wait on, so neither starts against a database
    # still running its first initdb.
    #
    # (!!) -h 127.0.0.1 is what makes this honest. Without it pg_isready asks
    # over the unix socket, which the temporary server initdb runs already
    # answers, and the check would go green before the database accepts a single
    # TCP connection. The `$$` leave both names to the container's shell.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:${MINIO_VERSION}
    restart: always
    command: server /data --console-address ":9001"
    ports:
      # 9000 is the S3 API and has to stay published: the browser fetches
      # documents straight from MinIO through a presigned URL, so S3_URL has to
      # resolve from the user's machine.
      # 9001 is MinIO's own admin console, a human UI over the bucket. Kept for
      # local inspection, and deliberately not forwarded online.
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_VOLUMES: /data
    volumes:
      - s3-data:/data
    # `up -d` returns once the containers are created, not once they answer.
    # createbucket waits on this rather than on a sleep.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Creates the bucket DSW writes into. DSW does not create it itself: in the S3
  # API, CreateBucket and PutObject are separate operations with separate
  # rights, and writing to a missing bucket returns NoSuchBucket. So this has to
  # run once, after the stack is up:
  #
  #   docker compose run --rm createbucket
  #
  # `profiles` keeps it out of `docker compose up`, which would otherwise treat
  # a one-shot task as a service that keeps stopping.
  #
  # (!!) The `$$` below escape compose's own interpolation and leave the
  # variables to the container's shell. With a single `$`, both credentials
  # would be expanded into a command line the host can read.
  createbucket:
    image: minio/mc:${MC_VERSION}
    profiles: [tools]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: sh
    command:
      - -c
      - |
        mc alias set dsw http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null &&
        mc mb --ignore-existing dsw/"$$S3_BUCKET" &&
        echo "bucket $$S3_BUCKET ready"

# Named volumes, so the data outlives the containers. Without them a
# `docker compose down` takes everything with it: accounts, knowledge models,
# projects, documents, and the bucket itself.
volumes:
  db-data:
  s3-data:
