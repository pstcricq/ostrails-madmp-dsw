# Pins the container, volume and network names, whatever the folder is called.
name: madmp-dsw

# DSW's settings, shared by server and docworker. Each name is that setting's
# application.yml path in upper case, and DSW reads the environment before any
# config file.
#
# (!!) The image carries its own application.yml underneath, whose defaults are
# not neutral: it names the database `wizard`. Set every value that matters
# rather than relying on a fallback.
#
# (!!) No `:-default` anywhere in this file. Default values are written in
# .env.example, and a second copy here would drift from it.
x-dsw-config: &dsw-config
  GENERAL_CLIENT_URL: ${CLIENT_URL}
  GENERAL_SECRET: ${GENERAL_SECRET}
  GENERAL_RSA_PRIVATE_KEY: ${GENERAL_RSA_PRIVATE_KEY}
  DATABASE_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_URL: ${S3_URL}
  S3_USERNAME: ${MINIO_ROOT_USER}
  S3_PASSWORD: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET}

services:
  # The DSW API.
  server:
    image: datastewardshipwizard/wizard-server:${DSW_VERSION}
    # Published for amd64 only, so an ARM host runs it emulated.
    platform: linux/amd64
    restart: always
    ports:
      # Loopback only. Reaching this from another machine goes through a proxy,
      # not by widening it.
      - 127.0.0.1:3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *dsw-config
    extra_hosts:
      - host.docker.internal:host-gateway
    # The image's own test, at a usable cadence. Its 300s interval and absent
    # start period would keep the container from reporting healthy for five
    # minutes however fast it answered.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 10s
      # Room for the migrations the first run applies. Failures in this window
      # do not count against retries.
      start_period: 300s
      retries: 3

  # The web interface.
  client:
    image: datastewardshipwizard/wizard-client:${DSW_VERSION}
    restart: always
    ports:
      # Loopback here too.
      - 127.0.0.1:8080:8080
    environment:
      # The client image's own variable, not a DSW config path. The browser
      # calls the API itself, so this has to be an address the *user's* machine
      # resolves, never a compose service name.
      API_URL: ${API_URL}

  # Renders documents.
  docworker:
    image: datastewardshipwizard/document-worker:${DSW_VERSION}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Waits for an API that answers, not for a container that exists.
      server:
        condition: service_healthy
    environment:
      <<: *dsw-config
      # The image bakes APPLICATION_CONFIG_PATH=/app/config/application.yml and
      # its CLI checks that the path exists before reading any configuration, so
      # a file has to be there even when every setting comes from the
      # environment. /dev/null passes the check and parses as an empty document.
      APPLICATION_CONFIG_PATH: /dev/null
    extra_hosts:
      - host.docker.internal:host-gateway

  # Sends DSW's mail. Idle while mail is disabled, which is why it is commented
  # out rather than deleted.
  #
  # (!!) Uncomment it together with enabling mail. Enabling mail without it
  # fails silently: the server queues mailer commands nobody processes, and the
  # interface still reports the message as sent.
  # mailer:
  #   image: datastewardshipwizard/mailer:${DSW_VERSION}
  #   restart: always
  #   depends_on:
  #     - postgres
  #     - server
  #   environment:
  #     <<: *dsw-config
  #     APPLICATION_CONFIG_PATH: /dev/null   # same requirement as docworker

  # The maDMP submission webhook. DSW reaches it by service name on the compose
  # network (http://submission:8080), so it needs no published port.
  submission:
    # (!!) The package is private for as long as its repository is, so a host
    # that has never run `docker login ghcr.io` fails the pull with a 401 that
    # reads like the image does not exist.
    image: ghcr.io/pstcricq/ostrails-madmp-core/submission:${MADMP_CORE_VERSION}
    restart: always
    # Listed one by one rather than `env_file: .env`, so this container holds
    # these four and none of the stack's other secrets.
    environment:
      SUBMISSION_TOKEN: ${SUBMISSION_TOKEN}
      REGISTRY_TOKEN: ${REGISTRY_TOKEN}
      REGISTRY_OWNER: ${REGISTRY_OWNER}
      REGISTRY_REPO: ${REGISTRY_REPO}
    # python rather than curl, the image carries no curl.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/health")
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No host port needed. Uncomment to poke it from the terminal for debugging.
    # ports:
    #   - 127.0.0.1:8085:8080

  # The database.
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: always
    # ports:
    #   - 127.0.0.1:5432:5432
    # Not published, nothing on the host calls it. Containers reach it as
    # postgres:5432, and inspecting it goes through the Docker daemon:
    #
    #   docker compose exec postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
    #
    # (!!) The database and the account are created once, at the very first
    # initdb. Changing these three values afterwards has no effect on an
    # existing database, it takes a `docker compose down -v` to start over.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # (!!) -h 127.0.0.1 is what makes this honest. Without it pg_isready asks
    # over the unix socket, which the temporary server initdb runs already
    # answers, and the check would go green before the database accepts a single
    # TCP connection. The `$$` leave both names to the container's shell.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  # Object storage, where rendered documents are kept.
  minio:
    image: minio/minio:${MINIO_VERSION}
    restart: always
    command: server /data --console-address ":9001"
    ports:
      # 9000 is the S3 API and has to stay published, the browser fetches
      # documents from it directly through a presigned URL. 9001 is MinIO's own
      # admin console, kept for local inspection and not forwarded online.
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_VOLUMES: /data
    volumes:
      - s3-data:/data
    # `up -d` returns once the containers are created, not once they answer.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Creates the bucket, which DSW does not create itself. Run once, after the
  # stack is up:
  #
  #   docker compose run --rm createbucket
  #
  # `profiles` keeps it out of `docker compose up`, which would otherwise treat
  # a one-shot task as a service that keeps stopping.
  #
  # (!!) The `$$` below escape compose's own interpolation and leave the
  # variables to the container's shell. With a single `$`, both credentials
  # would be expanded into a command line the host can read.
  createbucket:
    image: minio/mc:${MC_VERSION}
    profiles: [tools]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: sh
    command:
      - -c
      - |
        mc alias set dsw http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null &&
        mc mb --ignore-existing dsw/"$$S3_BUCKET" &&
        echo "bucket $$S3_BUCKET ready"

# Named, so the data outlives the containers. Without them `docker compose down`
# takes the database and the bucket with it.
volumes:
  db-data:
  s3-data:
